name: Validate OWSF

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Schema JSON syntax
        run: make lint-schemas

      - name: Examples (core schema + semantic validation)
        run: make validate-examples

      - name: Profile schemas (including composition)
        run: make validate-profiles

      - name: Converter determinism and round-trip
        run: make converter

  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Markdown lint
        run: make lint-md
