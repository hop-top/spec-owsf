name: Validate OWSF

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate core schema JSON syntax
        run: jq . schemas/owsf-core-v0.1.schema.json >/dev/null

      - name: Validate agent-loop profile schema JSON syntax
        run: jq . schemas/profiles/agent-loop-v0.1.schema.json >/dev/null

      - name: Install check-jsonschema
        run: pipx install check-jsonschema

      - name: Validate examples
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(examples/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example JSON files found in examples/."
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "Validating $f"
            jq . "$f" >/dev/null
            check-jsonschema --schemafile schemas/owsf-core-v0.1.schema.json "$f"
            python3 scripts/validate_owsf_semantics.py "$f"
          done

      - name: Validate agent-loop profile example
        run: check-jsonschema --schemafile schemas/profiles/agent-loop-v0.1.schema.json examples/agent-loop-owsf.json
